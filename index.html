<!doctype html><html lang="es"><meta charset="utf-8"><title>Licitaciones</title><style>body{font:16px system-ui;background:#eef2f6;color:#18304b;margin:40px}section{background:white;padding:22px;margin:15px 0;border-radius:12px}input,button,select{padding:10px;margin:4px;border:1px solid #bac8d4;border-radius:6px}button{background:#174b70;color:white}pre{white-space:pre-wrap}</style><h1>Gestión de licitaciones</h1><p>Administración de proveedores, concursos y ofertas · <a href="/docs">API interactiva</a></p><section><h2>Proveedores</h2><input id="nombre" placeholder="Nombre"><button onclick="send('proveedores','POST',{nombre:val('nombre')})">Registrar</button><button onclick="send('proveedores','GET')">Listar</button></section><section><h2>Licitaciones</h2><input id="codigo" placeholder="Código"><input id="titulo" placeholder="Título"><input id="presupuesto" type="number" placeholder="Presupuesto CRC"><input id="cierre" type="datetime-local"><button onclick="send('licitaciones','POST',{codigo:val('codigo'),titulo:val('titulo'),presupuesto:val('presupuesto'),cierre:new Date(val('cierre')).toISOString()})">Crear</button><button onclick="send('licitaciones','GET')">Listar</button><input id="lid" type="number" placeholder="ID licitación"><button onclick="send('licitaciones/'+val('lid')+'/estado','PATCH',{estado:'Publicada'})">Publicar</button><button onclick="send('licitaciones/'+val('lid')+'/estado','PATCH',{estado:'Cerrada'})">Cerrar</button><button onclick="send('evaluacion/'+val('lid'),'GET')">Evaluar</button></section><section><h2>Ofertas</h2><input id="ol" type="number" placeholder="ID licitación"><input id="op" type="number" placeholder="ID proveedor"><input id="monto" type="number" placeholder="Monto CRC"><button onclick="send('ofertas','POST',{licitacion:+val('ol'),proveedor:+val('op'),monto:val('monto')})">Ofertar</button><button onclick="send('ofertas','GET')">Listar</button></section><section><h2>Tipo de cambio</h2><input id="rate" type="number" value="500"><button onclick="send('tasa/1','PUT',{valor:val('rate')})">Guardar tasa</button><button onclick="send('tasa','GET')">Consultar</button></section><section><h2>Resultado</h2><pre id="out"></pre></section><script>const val=id=>document.getElementById(id).value;async function send(path,method,data){try{let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});document.getElementById('out').textContent=r.status+'\n'+JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById('out').textContent='Error de conexión'}}</script></html>
